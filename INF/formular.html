<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>php Formular</title>
	</head>
	<body>
		<img src="icons/icon.jpg", height="50px", alt="Roche Logo">
		<br>
		<form>
			<p>Sie haben Wünsche und Anregungen? Kontaktieren sie uns!</p>
			<br>
			<hr>
			<h3>
			Ihre Kontaktdaten:
			</h3>
			<label>
			Vorname: 
			<input type="text" name="Vorname">
			</label>
			<label>
			Nachname: 
			<input type="text" name="Nachname">
			</label>
			<!--<p>Hinterlassen Sie uns ihre E-Mail. Wir melden uns!</p>-->
			<br>
			<br>
			<label>
			E-Mail:
			<input type="email" name="Email">
			</label>
			<br>
			<br>
			<label>
			Adresse:
			<input type="text" name="Adresse">
			</label>
			<br>
			<br>
			<label>
			Geburtstag:
			<input type="date" name="Geburtstag">
			</label>
			<br>
			<br>
			<label>
			Handynummer:
			<input type="number" name="Handy">
			</label>
			<br>
			<br>
			<label>
			Versicherungs Nummer:
			<input type="number" name="Versicherung">
			</label>
			<br>
			<br>
			<label>
			Lieblingsfarbe Ihres Hundes:
			<input type="color" name="Farbe" value="red">
			</label>
			<br>
			<br>
			<label>
			Bank Pin:
			<input type="number" name="Bank">
			</label>
			<br>
			<br>
			<br>
			<h3>Ihr Geschlächt:</h3>
			<label> 
			<input type="radio" name="Geschlächt", value="M">
			Männlich
			</label>
			<label>
			<input type="radio" name="Geschlächt", value="W">
			Weiblich
			</label>
			<label>
				<input type="radio" name="Geschlächt", value="Idiot">
				Kampfhelikopter
				</label>
			<br>
			<br>
			<br>
			<h3>Art Ihres Anliegens:</h3>
			<label> 
			<input type="radio" name="KontaktArt", value="beschwärde">
			Beschwärde
			</label>
			<label>
			<input type="radio" name="KontaktArt", value="Frage" checked>
			Nachfrage
			</label>
			<br>
			<br>
			<h3>Wie können wir Ihnen helfen?</h3>
			<textarea name="Hilfstext",
			cols="40" rows="3">
			</textarea>
			<br>
			<br>
			<hr>
			<label>
			<input type="checkbox" name="Webung", checked>
			Ich möchte mit Werbemüll vollgespammt werden.
			</label>
			<br>
			<label>
			<input type="checkbox" name="Datenschutz">
			Ich aktzeptiere die datenschutz Bedingungen.
			</label>
			<br>
			<label>
			<input type="checkbox" name="AGB">
			Ich aktzeptiere die AGB.
			</label>
			<br>
			<label>
			<input type="checkbox" name="AGB">
			Ich aktzeptiere die EULA.
			</label>
			<br>
			<label>
			<input type="checkbox" name="AGB">
			Ich aktzeptiere die aktzeptanz.
			</label>
			<br>
			<br>
			<input type="submit" name="" value="Speichern">
		</form>
	</body>
</html>
